<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Techtonz | Where Technology Meets Innovation</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #f5f5f5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    overflow-x: hidden;
  }

  .container {
    max-width: 800px;
    width: 100%;
    text-align: center;
  }

  .logo {
    font-size: 3rem;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #00c6ff, #7b2ff7, #f107a3);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 10px;
  }

  .tagline {
    font-size: 1.2rem;
    color: #b8b8d1;
    margin-bottom: 5px;
    font-weight: 500;
  }

  .subtagline {
    font-size: 1rem;
    color: #00c6ff;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 50px;
    font-weight: 600;
  }

  .section-title {
    font-size: 1.5rem;
    margin-bottom: 25px;
    color: #ffffff;
    position: relative;
    display: inline-block;
  }

  .section-title::after {
    content: '';
    display: block;
    width: 60px;
    height: 3px;
    background: linear-gradient(90deg, #00c6ff, #7b2ff7);
    margin: 10px auto 0;
    border-radius: 2px;
  }

  .topics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-bottom: 60px;
  }

  .topic-card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 25px 15px;
    transition: transform 0.3s ease, background 0.3s ease, border-color 0.3s ease;
    backdrop-filter: blur(10px);
  }

  .topic-card:hover {
    transform: translateY(-6px);
    background: rgba(255, 255, 255, 0.1);
    border-color: #00c6ff;
  }

  .topic-icon {
    font-size: 1.8rem;
    margin-bottom: 10px;
    display: block;
  }

  .topic-name {
    font-size: 0.95rem;
    font-weight: 600;
    color: #e0e0f0;
  }

  .status-banner {
    background: rgba(241, 7, 163, 0.1);
    border: 1px solid rgba(241, 7, 163, 0.4);
    color: #ff8ad1;
    padding: 14px 20px;
    border-radius: 30px;
    font-size: 0.95rem;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }

  .dot {
    width: 8px;
    height: 8px;
    background: #f107a3;
    border-radius: 50%;
    display: inline-block;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(241, 7, 163, 0.6); }
    70% { box-shadow: 0 0 0 10px rgba(241, 7, 163, 0); }
    100% { box-shadow: 0 0 0 0 rgba(241, 7, 163, 0); }
  }

  footer {
    margin-top: 50px;
    font-size: 0.85rem;
    color: #6c6c8a;
  }
</style>
</head>
<body>

  <div class="container">
    <div class="logo">Techtonz</div>
    <p class="tagline">Where Technology Meets Innovation</p>
    <p class="subtagline">Learn &bull; Build &bull; Innovate</p>

    <h2 class="section-title">What You'll Find Here</h2>
    <div class="topics-grid">
      <div class="topic-card">
        <span class="topic-icon">🤖</span>
        <span class="topic-name">Artificial Intelligence</span>
      </div>
      <div class="topic-card">
        <span class="topic-icon">📊</span>
        <span class="topic-name">Data Science</span>
      </div>
      <div class="topic-card">
        <span class="topic-icon">🐍</span>
        <span class="topic-name">Python Programming</span>
      </div>
      <div class="topic-card">
        <span class="topic-icon">🌐</span>
        <span class="topic-name">Web Development</span>
      </div>
      <div class="topic-card">
        <span class="topic-icon">🎓</span>
        <span class="topic-name">Tech Tutorials</span>
      </div>
      <div class="topic-card">
        <span class="topic-icon">💡</span>
        <span class="topic-name">Digital Innovation</span>
      </div>
    </div>

    <div class="status-banner">
      <span class="dot"></span>
      Website currently under development
    </div>

    <footer>
      &copy; 2026 Techtonz. All rights reserved.
    </footer>
  </div>

</body>
    </html>
